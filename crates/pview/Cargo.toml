[package]
name = "atenea"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Atenea — native Linux EDA workbench (netlists, simulation, viewing)"

[[bin]]
name = "atenea"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", features = ["glow"] }
egui = "0.37"
rfd = "0.15"
plib = { path = "../plib" }
pmodel = { path = "../pmodel" }
pproj = { path = "../pproj" }
asim = { path = "../asim" }

[lints]
workspace = true
