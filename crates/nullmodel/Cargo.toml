[package]
name = "nullmodel"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Reference Atenea native model plugin (counter, for host testing)"

[lib]
crate-type = ["cdylib", "rlib"]

# C-ABI plugin: extern fns dereference caller-provided pointers.
# Every unsafe block carries a SAFETY comment.
# (No `workspace = true` here: cargo forbids mixing it with overrides.)
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
