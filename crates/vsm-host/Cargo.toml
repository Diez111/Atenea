[package]
name = "vsm-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Native host that loads Atenea simulation models (.so plugins)"

[dependencies]
libloading = "0.9"

# FFI boundary crate: loading arbitrary .so files is inherently unsafe.
# Every unsafe block carries a SAFETY comment; the safe API (`load` is
# `unsafe fn`, `step` is safe) contains the risk at this boundary.
# (No `workspace = true` here: cargo forbids mixing it with overrides.)
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
